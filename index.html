<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紙上交易</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#a9812f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="紙上交易">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#f4f1e9; --card:#fffdf7; --ink:#2b2721; --muted:#8a8173;
    --line:#e7e0cf; --gold:#a9812f; --green:#2f7d5d; --red:#c0392b;
    --chip:#faf6ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17150f; --card:#221f16; --ink:#e9e3d4; --muted:#9a917f;
      --line:#332f22; --gold:#d8ab55; --green:#5cbf95; --red:#e0736a; --chip:#1c1a12;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;
    padding:max(12px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));}
  .wrap{max-width:480px;margin:0 auto}
  .num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 2px 12px}
  header h1{font-size:1.15rem;margin:0;font-weight:650;letter-spacing:.02em}
  header .upd{font-size:.72rem;color:var(--muted)}
  button.refresh{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:8px;padding:5px 10px;font-size:.8rem;cursor:pointer}
  .banner{border-radius:10px;padding:9px 13px;font-size:.83rem;margin-bottom:12px;
    border-left:3px solid var(--green);background:var(--card)}
  .banner.bad{border-left-color:var(--red)}
  .banner b{font-weight:650}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 14px 12px;margin-bottom:14px}
  .tlabel{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
  .nav{font-size:1.9rem;font-weight:650}
  .nav small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-width:76px}
  .chip .k{font-size:.62rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .chip .v{font-size:1rem;font-weight:600}
  .up{color:var(--green)} .dn{color:var(--red)}
  svg.spark{display:block;width:100%;height:44px;margin:6px 0 10px}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  td .nm{color:var(--muted);font-size:.72rem;display:block}
  .meta{font-size:.72rem;color:var(--muted);margin-top:10px;line-height:1.7}
  .foot{text-align:center;font-size:.72rem;color:var(--muted);margin-top:8px}
  .foot a{color:var(--gold)}
  .err{color:var(--red);font-size:.85rem;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>紙上交易</h1>
    <span><span class="upd" id="upd">載入中…</span>
      <button class="refresh" id="refresh">↻</button></span>
  </header>
  <div id="root"><div class="err" id="err" hidden>讀取失敗,稍後再試</div></div>
  <div class="foot">
    <a href="./report.html">完整日報</a> · 自動產生,非投資建議
  </div>
</div>
<script>
const fmt = (n,d=0)=> (n==null||isNaN(n)) ? '—' :
  Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = n => (n==null||isNaN(n)) ? '—' : (n>=0?'+':'') + (n*100).toFixed(2) + '%';
const cls = n => n>0 ? 'up' : n<0 ? 'dn' : '';

function spark(hist){
  if(!hist || hist.length<2) return '';
  const v = hist.map(p=>p[1]);
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi-lo)||1;
  const W=100, H=44, pad=3;
  const pts = v.map((y,i)=>{
    const x = pad + i*(W-2*pad)/(v.length-1);
    const yy = H-pad - (y-lo)/span*(H-2*pad);
    return [x, yy];
  });
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = `${pad},${H-pad} ` + line + ` ${W-pad},${H-pad}`;
  const last = pts[pts.length-1];
  const rising = v[v.length-1] >= v[0];
  const col = rising ? 'var(--green)' : 'var(--red)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polygon points="${area}" fill="${col}" opacity="0.10"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${col}"/>
  </svg>`;
}

function trackCard(t){
  const rows = (t.positions||[]).map(p=>`<tr>
    <td>${p.sid}<span class="nm">${p.name||''}</span></td>
    <td class="num">${fmt(p.qty)}</td>
    <td class="num">${fmt(p.px,2)}</td>
    <td class="num ${cls(p.pnl_pct)}">${(p.pnl_pct>=0?'+':'')+p.pnl_pct}%</td>
    <td class="num">${fmt(p.mv)}</td></tr>`).join('') ||
    `<tr><td colspan="5" style="text-align:center;color:var(--muted)">（空手 / 無持倉）</td></tr>`;
  return `<section class="card">
    <div class="tlabel">${t.label} · 資料日 ${t.data_date||'—'}</div>
    <div class="nav num">${fmt(t.nav)}<small>NT$</small></div>
    <div class="chips">
      <div class="chip"><div class="k">當日</div><div class="v num ${cls(t.day_ret)}">${pct(t.day_ret)}</div></div>
      <div class="chip"><div class="k">總報酬</div><div class="v num ${cls(t.total_ret)}">${pct(t.total_ret)}</div></div>
      <div class="chip"><div class="k">Regime</div><div class="v">${t.regime_on?'ON':'OFF'}</div></div>
      <div class="chip"><div class="k">現金</div><div class="v num">${fmt(t.cash)}</div></div>
    </div>
    ${spark(t.nav_hist)}
    <table>
      <tr><th>代號</th><th>股數</th><th>現價</th><th>未實現</th><th>市值</th></tr>
      ${rows}
    </table>
    <div class="meta">PROFILE ${t.profile} · 本金 NT$${fmt(t.init)} · ${t.n_hold} 檔 ·
      每 ${t.rebal_days} 交易日換股${t.last_order? ' · 上次換股 '+t.last_order : ''}</div>
  </section>`;
}

function render(d){
  document.getElementById('upd').textContent = '更新 ' + d.updated;
  const bad = !d.health.ok;
  const hLine = (d.health.text||'').split('\n').slice(0,2).join(' ');
  let html = `<div class="banner ${bad?'bad':''}"><b>系統健康</b> · ${bad?'有異常 ✗':'全部正常 ✔'}
    <div style="font-size:.74rem;color:var(--muted);margin-top:2px">${hLine}</div></div>`;
  html += trackCard(d.tracks.main);
  html += trackCard(d.tracks.sim);
  document.getElementById('root').innerHTML = html;
}

async function load(){
  try{
    const r = await fetch('./data.json?_=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    render(d);
    try{ localStorage.setItem('pt_cache', JSON.stringify(d)); }catch(e){}
  }catch(e){
    const c = (()=>{ try{ return JSON.parse(localStorage.getItem('pt_cache')); }catch(_){ return null; }})();
    if(c){ render(c); document.getElementById('upd').textContent = '離線(舊資料 ' + c.updated + ')'; }
    else { document.getElementById('root').innerHTML = '<div class="err">讀取失敗,稍後再試</div>'; }
  }
}
document.getElementById('refresh').onclick = load;
load();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
</body>
</html>
